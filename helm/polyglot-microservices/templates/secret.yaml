apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque

stringData:
  POSTGRES_USER_AUTH: "{{ .Values.secrets.POSTGRES_USER_AUTH }}"
  POSTGRES_PASSWORD_AUTH: "{{ .Values.secrets.POSTGRES_PASSWORD_AUTH }}"
  POSTGRES_DB_AUTH: "{{ .Values.secrets.POSTGRES_DB_AUTH }}"

  POSTGRES_USER_TASK: "{{ .Values.secrets.POSTGRES_USER_TASK }}"
  POSTGRES_PASSWORD_TASK: "{{ .Values.secrets.POSTGRES_PASSWORD_TASK }}"
  POSTGRES_DB_TASK: "{{ .Values.secrets.POSTGRES_DB_TASK }}"

  MONGO_INITDB_ROOT_USERNAME: "{{ .Values.secrets.MONGO_INITDB_ROOT_USERNAME }}"
  MONGO_INITDB_ROOT_PASSWORD: "{{ .Values.secrets.MONGO_INITDB_ROOT_PASSWORD }}"
