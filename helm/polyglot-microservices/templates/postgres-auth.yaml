apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "postgres-auth"
spec:
  selector:
    matchLabels:
      app: "postgres-auth"
  serviceName: "postgres-auth-headless-svc"
  replicas: 1

  template:
    metadata:
      labels:
        app: "postgres-auth"

    spec:
      containers:
        - name: "postgres-auth"
          image: "{{ .Values.postgresAuth.image.repository }}:{{ .Values.postgresAuth.image.tag }}"
          ports:
            - containerPort: 5432
          env:
            - name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresAuth.secretName }}"
                  key: "POSTGRES_USER_AUTH"
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresAuth.secretName }}"
                  key: "POSTGRES_PASSWORD_AUTH"
            - name: "POSTGRES_DB"
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresAuth.secretName }}"
                  key: "POSTGRES_DB_AUTH"
          volumeMounts:
            - name: "postgres-auth-pvc"
              mountPath: "/var/lib/postgresql/data"
              subPath: "postgres-auth-data"
  volumeClaimTemplates:
    - metadata:
        name: postgres-auth-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ .Values.postgresAuth.storage.className }}"
        resources:
          requests:
            storage: "{{ .Values.postgresAuth.storage.size }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "postgres-auth-headless-svc"

spec:
  selector:
    app: "postgres-auth"
  clusterIP: "None"

  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: "postgres-auth-svc"

spec:
  selector:
    app: "postgres-auth"

  ports:
    - port: 5432
      targetPort: 5432
      name: http
