apiVersion: apps/v1
kind: Deployment
metadata:
  name: "analytics-worker-task-deployment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "analytics-worker-task"

  template:
    metadata:
      labels:
        app: "analytics-worker-task"
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "analytics"
        vault.hashicorp.com/agent-inject-secret-config: "polyglot-platform/data/app-secrets"
        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret "polyglot-platform/data/app-secrets" -}}
          export MONGODB_URL="{{ .Data.data.MONGODB_URL }}"
          {{- end }}`}}

    spec:
      serviceAccountName: analytics-worker
      containers:
        - name: "analytics-worker-task"
          image: "{{ .Values.analyticsWorkerTask.image.repository }}:{{ .Values.analyticsWorkerTask.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              . /vault/secrets/config
              exec python -m app.main
          env:
            - name: "DATABASE_NAME"
              value: "analytics"
            - name: "KAFKA_BOOTSTRAP_SERVERS"
              value: "kafka-svc:9092"
            - name: "KAFKA_TOPIC_TASK"
              value: "task-events"
            - name: "KAFKA_GROUP_ID"
              value: "analytics-worker-task"
