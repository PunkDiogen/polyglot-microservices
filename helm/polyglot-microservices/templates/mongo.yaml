apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "mongo"
spec:
  selector:
    matchLabels:
      app: "mongo"
  serviceName: "mongo-headless-svc"
  replicas: 1

  template:
    metadata:
      labels:
        app: "mongo"

    spec:
      containers:
        - name: "mongo"
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          ports:
            - containerPort: 27017
          env:
            - name: "MONGO_INITDB_ROOT_USERNAME"
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.mongo.secretName }}"
                  key: "MONGO_INITDB_ROOT_USERNAME"
            - name: "MONGO_INITDB_ROOT_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.mongo.secretName }}"
                  key: "MONGO_INITDB_ROOT_PASSWORD"
          volumeMounts:
            - name: "mongo-pvc"
              mountPath: "/data/db"
              subPath: "mongo-data"
  volumeClaimTemplates:
    - metadata:
        name: mongo-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ .Values.mongo.storage.className }}"
        resources:
          requests:
            storage: "{{ .Values.mongo.storage.size }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "mongo-headless-svc"

spec:
  clusterIP: "None"
  selector:
    app: "mongo"

  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: "mongo-svc"

spec:
  selector:
    app: "mongo"

  ports:
    - port: 27017
      targetPort: 27017
